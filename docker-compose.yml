name: test-vote

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
      POSTGRES_DB: vote
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "synchronous_commit=off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vote -d vote"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    # Голоса живут в Redis только на время опроса, персистентность не нужна.
    # noeviction, чтобы под нагрузкой не потерять дедуп-ключи молча.
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory-policy"
      - "noeviction"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://vote:vote@postgres:5432/vote?sslmode=disable"
      REDIS_ADDRS: "redis:6379"
      ADMIN_TOKEN: "local-admin-token"
      COOKIE_SECRET: "local-cookie-secret-change-me"
      FRONTEND_DIR: "/app/frontend"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
